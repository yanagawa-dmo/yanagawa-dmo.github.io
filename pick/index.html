<title>座標をひろう｜提灯で巡る。柳川の妖しい話。</title>
<style>
:root{--ink:#152B3A;--kinari:#E3D5BB;--kinari2:#A99B84;--aka:#B4392C;--hi:#E8CE9A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--kinari);font-family:system-ui,sans-serif;
  font-size:15px;line-height:1.85;padding:18px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:19px;font-weight:600}
h2{font-size:14px;font-weight:600;color:var(--hi);margin:22px 0 8px}
p{color:var(--kinari2);font-size:13.5px;margin-bottom:12px}
.map{position:relative;width:100%;border:1px solid rgba(227,213,187,.2);border-radius:4px;
  overflow:hidden;cursor:crosshair;background:#0d1a24;touch-action:manipulation}
.map img{width:100%;display:block}
.ref{position:absolute;transform:translate(-50%,-100%);pointer-events:none;width:17px;
  filter:grayscale(.6) brightness(.75);opacity:.8}
.ref img{width:100%;display:block}
.ref span{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:9.5px;color:var(--kinari2);text-shadow:0 1px 5px #000,0 0 3px #000}
.mk{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:#2fa36b;border:2px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.45);pointer-events:none}
.mk b{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  white-space:nowrap;font-size:11px;font-weight:500;color:#7fd6a5;
  text-shadow:0 1px 6px #000,0 0 3px #000}
.hit{background:rgba(13,26,36,.9);border:1px solid rgba(227,213,187,.25);border-radius:4px;
  padding:12px 14px;margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hit code{font-size:15px;color:var(--hi);font-family:ui-monospace,monospace;
  letter-spacing:.02em;flex:1;min-width:280px;word-break:break-all}
button{font:inherit;font-size:13px;background:transparent;color:var(--kinari);cursor:pointer;
  border:1px solid rgba(227,213,187,.35);border-radius:4px;padding:8px 14px}
button:hover{border-color:var(--hi);color:var(--hi)}
ul{margin:0 0 12px 18px;color:var(--kinari2);font-size:13px}
.dim{color:var(--kinari2);font-size:12px}
</style>

<h1>座標をひろう</h1>
<p><strong>地図の上をクリック（スマホならタップ）</strong>すると、その地点の緯度経度が出ます。
Googleマップを開く必要はありません。<br>
薄く光っているのは、すでに設定ずみの十話です。位置の目安にしてください。</p>

let got = "";
map.addEventListener("click", e=>{
  const r = map.getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width*100, y = (e.clientY - r.top)/r.height*100;
  const [la,lo] = toLL(x,y);
  got = `${la}, ${lo}`;
  document.getElementById("ll").textContent = got;
  map.querySelectorAll(".mk").forEach(n=>n.remove());
  const m = document.createElement("div");
  m.className = "mk"; m.style.left = x+"%"; m.style.top = y+"%";
  m.innerHTML = "<b>ここ</b>";
  map.appendChild(m);
  document.getElementById("cp").textContent = "コピー";
});

function copy(){
  if(!got) return;
  const b = document.getElementById("cp");
  navigator.clipboard?.writeText(got)
    .then(()=>{ b.textContent = "コピーしました"; setTimeout(()=>b.textContent="コピー",2000); })
    .catch(()=>{ b.textContent = "選んでコピーしてください"; });
}
</script>
